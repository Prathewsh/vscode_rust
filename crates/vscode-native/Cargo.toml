[package]
name = "vscode-native"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "code-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
ropey = "1.6"
walkdir = "2.5"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = { version = "5.2", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "regex-fancy"] }
portable-pty = "0.8"

